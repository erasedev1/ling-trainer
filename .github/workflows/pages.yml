# GitHub Pages deployment.
#
# Pages must serve the *built* site, not the repository source: index.html in the
# repo points at /src/main.tsx, which a browser cannot execute. This workflow
# builds with Vite and publishes dist/.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine is the product; a broken build should not reach the club.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only the default branch is published; other branches still get built and
    # tested above.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
