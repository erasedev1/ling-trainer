# GitHub Pages deployment.
#
# Pages must serve the *built* site, not the repository source: index.html in the
# repo points at /src/main.tsx, which a browser cannot execute. This workflow
# builds with Vite and publishes dist/.
#
# IT CANNOT SET THE PAGES SOURCE FOR YOU. GitHub blocks the Pages settings API
# for a workflow's GITHUB_TOKEN — `PUT /repos/{owner}/{repo}/pages` answers 403
# "Resource not accessible by integration" even with `pages: write` granted. A
# human has to make this one change, once:
#
#     Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#
# Until then Pages stays in "legacy" (branch) mode, GitHub's own "pages build
# and deployment" workflow runs on every push, and it republishes the raw source
# over the top of this deployment. Whichever finishes last wins, so the site
# flickers between a working build and a blank page. The `check` job below says
# so loudly rather than letting that look like success.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Report the Pages build source. This job cannot change it (see the header):
  # its only job is to make a misconfiguration visible instead of silent.
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: read
    steps:
      - name: Check that Pages is set to deploy from GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build source: $current"
          if [ "$current" = "workflow" ]; then
            echo "Pages is deploying from GitHub Actions. This workflow's build is what visitors get." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## :warning: GitHub Pages is not serving this build"
            echo
            echo "Pages build source is \`$current\`, not \`workflow\`."
            echo
            echo "While it stays that way, GitHub's built-in \"pages build and deployment\""
            echo "publishes the repository **source** on every push. The browser is handed"
            echo "\`index.html\`'s \`<script src=\"/src/main.tsx\">\`, cannot execute TypeScript,"
            echo "and renders a **blank page**."
            echo
            echo "Fix it once, by hand — a workflow token is refused this API (403):"
            echo
            echo "> **Settings -> Pages -> Build and deployment -> Source -> \"GitHub Actions\"**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Pages is serving the repo source::Set Settings > Pages > Build and deployment > Source to 'GitHub Actions'. Until then the site renders blank."

  build:
    needs: check
    # `check` is skipped on non-default branches, and never blocks a deploy.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine is the product; a broken build should not reach the club.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only the default branch is published; other branches still get built and
    # tested above.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
