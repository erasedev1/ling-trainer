# GitHub Pages deployment.
#
# Pages must serve the *built* site, not the repository source: index.html in the
# repo points at /src/main.tsx, which a browser cannot execute. This workflow
# builds with Vite and publishes dist/.
#
# It also switches the Pages build source to "GitHub Actions" itself (the
# `source` job below). While Pages is set to "Deploy from a branch", GitHub runs
# its own "pages build and deployment" workflow on every push, which republishes
# the raw source and overwrites this deployment moments after it lands — the two
# race, and the branch build usually wins.
#
# To go back to branch deploys: Settings → Pages → Build and deployment →
# Source → "Deploy from a branch". Delete the `source` job first, or it will
# switch back on the next push.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Make Pages serve this workflow's artifact rather than the branch. Runs before
  # the build so the branch-built deployment is not still racing this one.
  source:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Set the Pages build source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Already correct, or already ours: nothing to do.
          current=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo none)
          echo "current build source: $current"
          if [ "$current" = "workflow" ]; then exit 0; fi
          if [ "$current" = "none" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi
          echo "switched to: $(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
        # A repository or organisation policy can withhold this permission. That
        # is not a build failure — the deploy below still runs, and the README
        # explains the one setting to change by hand.
        continue-on-error: true

  build:
    needs: source
    # `source` is skipped on non-default branches; still build and test there.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine is the product; a broken build should not reach the club.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only the default branch is published; other branches still get built and
    # tested above.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
